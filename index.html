traits: {
  professional: "+10% z Train i Mentor; w walce trzyma się planu i rzadziej goni zabójstwa; +1 do rzutów na zagadki; znaleziony sprzęt zawsze wraca w plecaku.",
  ambitious: "Pensja +15%; w walce goni zabójstwa; na wyprawie może przejmować testy umiejętności i od razu zakłada znaleziony sprzęt, a jako lider pomija 75% pokojów odpoczynku.",
  loyal: "Pensja -12%, przy odnowieniu żąda jeszcze 12% mniej, targ przyjmuje o 15 pkt chętniej, odporny na podkupienie; w walce osłania rannych i nigdy nie zostawia poległego.",
  oathbound: "Przy odnowieniu przysięgi żąda 38% mniej (nigdy poniżej połowy), o 35 pkt chętniej przyjmuje targ albo zostaje mimo bogatszej oferty, odporny na podkupienie, nie zostawia poległych.",
  greedy: "Pensja +25%, przy odnowieniu +10%; w walce goni zabójstwa; od razu zakłada znaleziony sprzęt; jeśli zginie, jego ekwipunek przepada.",
  humble: "Pensja -10%, mniej traci morale na zbyt łatwych wyprawach; w walce nerwy trzymają nieco lepiej; znaleziony sprzęt zawsze wraca w plecaku.",
  arrogant: "Pensja +12%; w walce nerwy trzymają dużo lepiej, ale przesadza i rzadko osłania; werdykt wyprawy zmienia morale o 50% mocniej, a lichy sprzęt je obniża.",
  brave: "W walce nerwy trzymają lepiej, ściąga 8% więcej zagrożenia; +1 do rzutów na pułapki; jako lider zawraca krok później niż kazano; +4 w konkursie męstwa na Gathering.",
  cowardly: "W walce dużo szybciej traci nerwy i ściąga 22% mniej zagrożenia; jako lider zawraca krok wcześniej; poległy jest o 8 pkt częściej zostawiany.",
  "iron-willed": "W walce nerwy trzymają lepiej, +6% zagrożenia; werdykt wyprawy zmienia morale o połowę słabiej; jako lider zawraca dokładnie wg rozkazu.",
  unbreakable: "W walce nerwy trzymają dużo lepiej, +10% zagrożenia; jako lider zawraca dokładnie wg rozkazu, a pokonanie nazwanego wroga na rozwidleniu zmniejsza stres drużyny o 5.",
  superstitious: "W walce szybciej traci nerwy; przeklęty sprzęt -2 morale na wyprawę, błogosławiony albo trofeum bestii +1; jako lider zawraca wcześniej i unika zapieczętowanych drzwi.",
  shaken: "W walce traci nerwy szybciej i mocniej; jako lider zawraca krok wcześniej. Zdobyte na wyprawie może minąć przy odpoczynku: 9% dziennie przy kondycji 70+.",
  "team-player": "Pensja -8%; w walce rzuca się osłaniać ciężko rannych; lider uspokaja go o 25% mocniej; znaleziony sprzęt zawsze wraca w plecaku.",
  "lone-wolf": "W walce nie daje przywództwa, nie bierze go od lidera i nie osłania; więzi z innymi słabną; poległy jest o 8 pkt częściej zostawiany.",
  exacting: "Jako nauczyciel na placu: uczniowie rosną 18% szybciej, ale dostają 4 stresu co 6 dni nauki; jako lider uspokaja drużynę, jakby miał +1 Leadership.",
  "broad-hand": "Jako nauczyciel uczy bohatera innej roli w pełnym tempie (inni w 55%); drużyna chętniej przyjmuje go jako lidera.",
  "quiet-example": "Od etapu Seasoned, gdy jest w gildii, liczy się podwójnie do liczby młodych na Train, którzy dostają nauczyciela; drużyna chętniej przyjmuje go jako lidera.",
  "old-school": "Jako nauczyciel uczy własnego powołania w tempie 155% (inni 130%), a innych w 70%; jako lider bohaterowie jego powołania biorą o 25% więcej jego uspokajania.",
  mentor: "Uczy 20% szybciej na placu i może mentorować każdego rosnącego bohatera o niższym poziomie; w walce uspokaja pobliskich i chroni rannych; prowadząc na rozwidleniu, najmłodszy dostaje 2 XP.",
  "hot-headed": "W walce +14% zagrożenia, częściej przesadza, rzadziej słucha rozkazów i odrywa się, by dobijać słabych; -2 do rzutów na zagadki i pułapki, może je przejmować.",
  lucky: "+2 do każdego swojego rzutu na pułapkę i zagadkę, raz na wyprawę przerzuca naturalną 1; w walce 2,7% trafień w niego nic nie robi.",
  reckless: "W walce +16% zagrożenia, częściej przesadza i łamie rozkazy; -2 do rzutów na zagadki i pułapki, może je przejmować, zakłada znaleziony sprzęt wbrew rozkazom.",
  methodical: "W walce lepiej trzyma się rozkazów i rzadziej przesadza; +2 do rzutów na zagadki; jako lider zawraca dokładnie wg rozkazu i rozgląda się przed rozwidleniem.",
  "glory-hunter": "W walce porzuca rolę, by dobić każdego wroga poniżej 22% zdrowia; chce 10% więcej pensji, werdykt wyprawy zmienia mu morale 1,5x mocniej, szybciej marudzi na łatwych wyprawach.",
  clumsy: "Po swoim nieudanym rzucie na pułapkę w połowie przypadków przechodzi, ale gubi najtańszy nielegendarny przedmiot; jako lider zapieczętowane drzwi bez rozpoznania to DC +3, a sakiewka bez rozpoznania jest o 25% mniejsza.",
  stalwart: "W walce nerwy trzymają nieco lepiej; werdykt wyprawy zmienia morale o połowę słabiej; jeśli przeżyje wyprawę, żaden poległy nie zostaje.",
  diligent: "+10% z Train; zawsze przynosi znaleziony sprzęt; jako lider rozgląda się przed rozwidleniem; mniej przeszkadzają mu łatwe wyprawy.",
  hopeful: "Na wyprawie, dopóki stoi, drużyna dostaje 10% mniej stresu po każdej walce; jako lider zawraca krok później i skłania się ku zapieczętowanym drzwiom.",
  "quick-witted": "+1 do każdego swojego rzutu na pułapkę i zagadkę; jako lider rozgląda się przed rozwidleniem; +4 w teście bystrości na Gathering.",
  charismatic: "Więzi z nim rosną szybciej; jako lider jest chętniej przyjmowany i mocniej uspokaja; ryzykowne rozwidlenie nie kosztuje morale; +5 w występie przed tłumem na Gathering.",
  stoic: "W walce nerwy trzymają lepiej i mniej słabną przy ranach; jako lider zawraca dokładnie wg rozkazu, a ryzykowne rozwidlenie nie kosztuje morale.",
  vigilant: "W walce lepiej trzyma szyk i rzadziej przesadza; o połowę mniejsza szansa kłopotów w nocnym obozie; jako lider rozgląda się przed rozwidleniem.",
  tireless: "W walce +4% zagrożenia i lepiej słucha rozkazów; prowadząc w pokoju odpoczynku, w 75% pomija odpoczynek za złoto; gdy prowadzi bogatszą ścieżką, dodatkowa walka zmniejsza stres wszystkich o 4.",
  "cool-headed": "W walce nerwy trzymają lepiej i mniej się strzępią przy ranach; werdykt wyprawy zmienia morale o połowę słabiej; jako lider zawraca dokładnie wg rozkazu.",
  "sure-footed": "W walce 0,7% trafień w niego nic nie robi i rzadziej przesadza; jako lider nieudana pułapka za zapieczętowanymi drzwiami rani drużynę o połowę słabiej.",
  "field-medic": "W walce, jeśli jego klasa nie leczy, dostaje Field Dressing (leczenie co 12 s) i często osłania sojuszników poniżej 35% zdrowia; prowadząc na rozwidleniu, leczy drużynę o 8%.",
  inspiring: "W walce uspokaja nerwy i osąd pobliskich i chroni rannych; jako lider jest chętniej przyjmowany, a ryzykowne rozwidlenie nie kosztuje morale.",
  "child-of-the-halls": "Drużyna chętnie przyjmuje go jako lidera; ma +3 lojalności wobec zakusów rywali; prowadząc na rozwidleniu, najpierw sprawdza obie drogi.",
  dauntless: "W walce nerwy trzymają lepiej, a jego obrażenia ściągają 9% więcej zagrożenia; jako lider zawraca krok później i wybiera zapieczętowane drzwi albo nazwanego wroga.",
  brittle: "W walce nerwy pękają szybciej i mocniej, a ranny częściej źle ocenia; jako lider zawraca krok wcześniej i trzyma się znanej drogi.",
  insubordinate: "W walce rzadziej słucha rozkazów, a głos lidera zwiększa jego szansę na błędną ocenę; gorzej buduje więzi; prowadząc, wybiera drogę odwrotną do tej, którą sugeruje stan drużyny.",
  vain: "W walce goni dobijanie i rzadziej osłania; werdykt wyprawy zmienia morale 1,5x mocniej; szybciej marudzi na łatwych wyprawach, lichy sprzęt kosztuje go morale.",
  haunted: "W walce nerwy pękają szybciej, rzadziej przesadza; jako lider zawraca krok wcześniej i unika zapieczętowanych drzwi.",
  steady: "W walce bardziej trzyma się rozkazów; werdykt wyprawy zmienia morale o połowę słabiej; jako lider nieco mocniej uspokaja i zawraca dokładnie wg rozkazu.",
  watchful: "W walce rzadziej przesadza; nocny atak w obozie o połowę mniej prawdopodobny; na zadaniu przypadkowe znalezisko o 50% częstsze.",
  generous: "W walce częściej osłania ciężko rannego; łatwiej buduje więzi i jest chętniej przyjmowany jako lider; wygrana sakiewka na rozwidleniu daje każdemu innemu +3 morale.",
  curious: "Na wyprawie może przejąć test umiejętności od najlepiej pasującego, a prowadząc wybiera zapieczętowane drzwi; znaleziska na zadaniach 2,1x częstsze; w walce nieco częściej przesadza.",
  traditional: "W walce trochę bardziej trzyma się rozkazów; sprzeciwia się liderowi z mniejszym stażem; prowadząc, wybiera znaną drogę.",

  "quick-to-mend": "Rany goją się 1,5x szybciej dziennie (nadal maks. 2,5 dnia leczenia na dzień, 2 przy ciężkiej ranie); na zadaniu Sellsword +5% gotowości dla drużyny.",
  "slow-to-mend": "Rany goją się w 2/3 zwykłego tempa; prowadząc, wybiera znaną drogę; na zadaniu Sellsword -6% gotowości dla drużyny.",

  weathered: "Na wyprawie kara warunku lochu do statystyk, oparzenia od płonącej ziemi i stres od zimna na pokój są o połowę mniejsze; na Expedition +5% gotowości dla drużyny.",
  "fair-weather": "Na wyprawie kara warunku lochu, oparzenia i stres od zimna są o 50% większe; gdy jest wśród ocalałych, poległy jest o 8% częściej zostawiany.",
  dutiful: "Nigdy nie odmawia wyprawy ani zadania, nawet przy najniższym morale; gdy jest wśród ocalałych, nikt nie zostaje; na rozwidleniu bierze to, czego potrzebuje gildia; na Sellsword +5% gotowości.",
  thrifty: "Przy odnowieniu przysięgi żąda 10% mniej; po wyprawie zwykły albo zużyty sprzęt daje +1 morale (nie powyżej 80); na Expedition +5% gotowości.",

  easygoing: "Każda kłótnia z nim gaśnie dwa razy szybciej; na Expedition +5% gotowości; jako lider prośba bohatera na rozwidleniu mocniej go przekonuje.",
  "giant-killer": "W walce zadaje 25% więcej obrażeń nazwanym wrogom (bossowie i wszystko, co nazywa bestiariusz); na Bounty +5% gotowości.",

const GAME2 = {"conv":[["the-shield","The Shield","honour","Holds that the strong exist to stand between the weak and the dark, and steps into that gap whether or not anyone asked."],["no-one-left","No One Left","honour","Believes a guild that leaves its own behind has already lost, and will spend more to bring one home than the one was ever worth."],["mercy-first","Mercy First","honour","Believes a blade stayed is worth more than a blade drawn, and has held their own a beat too long more than once."],["old-ways","The Old Ways","honour","Keeps the rites and the old debts, sure a realm that forgets them falls twice."],["quiet-hand","The Quiet Hand","honour","Believes the best-won fight is the one no one had to have, and will talk long past the point where talking helps, to spare it."],["answer-for-own","Answer for Your Own","honour","Holds that a wrong done in their name is theirs to set right, whatever it costs beyond the wrong itself."],["last-to-fall","The Last to Fall","honour","Holds that the leader eats last and dies last, or is no leader."],["first-through-door","The First Through the Door","honour","Will not ask of anyone what they would not walk into first, and is through it before the wiser plan is done."],["glory-outlasts","Glory Outlasts","ruthless","Lives for the deed that outlives the doer, and counts the cost lightly."],["ends-over-means","Ends Over Means","ruthless","Holds that a win is a win and the dead keep no score, so the cost is always someone else's to count."],["the-reckoning","The Reckoning","ruthless","Holds that some wrongs are answered only in steel, and waiting just feeds them."],["burn-it-clean","Burn It Clean","ruthless","Holds that a rot left standing spreads, and some things are better ended than mended."],["high-ground","Take the High Ground","ruthless","Believes advantage is not cheating, and a fair fight is a fool's fight."],["live-loud","Live Loud","ruthless","Believes a short life told well beats a long one told never, and takes the risk that makes the better story."],["ledger-balances","The Ledger Balances","ruthless","Trusts that every debt, of coin or blood, comes due and must be paid, and keeps a longer account than anyone they deal with knows."],["long-climb","The Long Climb","none","Believes a name is earned rung by rung and owed to no one, and refuses the hand up even when it is freely offered."],["coin-is-honest","Coin Is Honest","ruthless","Trusts a full purse further than a fine speech, and takes the measure of anyone by what they will actually pay."],["knowledge-owed","Knowledge Is Owed","ruthless","Holds that what the dark hides was meant for the light, and will pay any price to carry it back."],["chart-the-way","Chart the Way","none","Holds that every road has been walked and written down by someone already, and would rather lose a night to the old charts than a season to the wrong valley."],["free-blades","Free Blades","ruthless","Believes no oath should outlast the reason it was sworn, and walks the moment the reason is gone."],["kin-above-crown","Kin Above Crown","honour","Gives their loyalty to blood and hearth, and leaves the empty crown to those who still fight over it."],["prove-doubters","Prove the Doubters","ruthless","Carries every slight ever spoken of them, and means to bury each one."],["waste-nothing","Waste Nothing","honour","Cannot abide a loss that need not have happened, of a life, a coin, or an hour."],["earn-the-bread","Earn the Bread","none","Believes a delver is owed nothing they have not bled for, and trusts no one who was handed what they hold."],["blade-not-banner","Trust the Blade, Not the Banner","honour","Serves the people beside them before any cause above them, and will abandon a righteous one to pull a comrade clear."],["old-debts-first","Old Debts First","honour","Holds that you clear what you owe before you take what you want, and has watched the thing they wanted walk away while they settled up."],["steel-sharpens","Steel Sharpens Steel","none","Holds that a rival makes you better than any friend ever could, and half-hopes the rival never falls."],["faith-holds","Faith Holds","honour","Believes something watches over the just, and walks into the dark unafraid for it."],["never-yield","Never Yield","none","Holds that a thing worth doing is worth doing past where sense would stop."],["word-given","The Word Given","honour","Believes an oath sworn is an oath kept, whatever it comes to cost."],["question-everything","Question Everything","none","Trusts nothing they have not seen proven, least of all an order."],["sharp-tongue","The Sharp Tongue","ruthless","Believes a truth said plainly beats a kindness half-meant, and has emptied a room that way more than once."],["hold-the-line","Hold the Line","honour","Believes ground given is ground someone else must die to take back."],["debt-of-saved","The Debt of the Saved","honour","Holds that a life you pull from the dark is a life you answer for after, and keeps a quiet count of everyone they have carried out."],["no-cowards-death","No Coward's Death","honour","Believes how a person dies is the last thing they get to say, and means everyone under their banner gets to say it well."],["shield-the-green","Shield the Green","honour","Puts the youngest and rawest behind them by instinct, and has taken a wound that was meant for a first-year."],["mend-not-end","Mend, Not End","honour","Believes almost anything broken can be brought back if someone bothers, and bothers when no one else will."],["carry-the-fire","Carry the Fire","honour","Holds that someone has to keep hope lit when the dark is winning, and has decided it may as well be them."],["winners-write-it","Winners Write It","ruthless","Holds that the tale is told by whoever is left standing, so the only real sin is losing."],["mercy-luxury","Mercy Is a Luxury","ruthless","Believes kindness is a thing you can afford only after the winning, and has left it for after more than once."],["strike-first","Strike First","ruthless","Holds that the blow you do not throw is the one that lands on you, and never waits to be sure."],["useful-over-good","Useful Over Good","ruthless","Keeps whoever delivers, and does not much care what they are."],["no-second-place","No Second Place","ruthless","Holds that a placing is a polite word for losing, and would rather crash out going for the win."],["keep-the-pace","Keep the Pace","ruthless","Holds a guild is only as strong as it is willing to be, and has no patience for anyone who cannot keep up with the climb."],["work-is-meaning","The Work Is the Meaning","none","Cares less for causes and crowns than for the next hard thing done well, and is uneasy in the quiet after."],["no-gods-no-patrons","No Gods, No Patrons","none","Trusts nothing they cannot see, bleed, or spend, and least of all the ones who ask for faith."],["read-the-room","Read the Room","ruthless","Believes the rules are for people who cannot read a situation, and bends them to whatever the moment needs."],["quiet-life-one-day","The Quiet Life, One Day","none","Fights only to reach a day they can stop fighting, and does not entirely believe that day exists."],["name-over-coin","A Name Over Coin","none","Takes the deed that makes the story over the one that fills the purse, every time, and has lived a little poorer for it."],["trust-earned-once","Trust, Earned Once","none","Gives their trust slowly and completely, and there is no second time once it is spent."],["the-craft","The Craft Above All","none","Cares more that a thing is done right than that it is done for good or ill, and takes a cold pride in the doing."],["for-the-underdog","For the Underdog","honour","Takes the side of whoever is losing, on principle, and has backed some genuinely bad causes on it."],["change-or-die","Change or Die","none","Holds that a guild doing things the way it always has is already dying, and pushes for the new even when the old still works."],["someone-always-pays","Someone Always Pays","honour","Believes nothing is free and the bill always finds someone, and would rather it found them than a friend."],["luck-is-real","Luck Is Real","none","Believes fortune favours the ones who show up, and shows up to everything on the chance that it does."]],"flaws":[["pride","Pride","Would sooner fall than be seen to take a backward step, and the fall tends to come on the one step everyone begged them to take."],["greed","Greed","Has never once walked past gold that could be taken, and the piece they cannot leave is the one that was warded for a reason."],["unlocked-door","The Unlocked Door","Cannot leave a sealed vault sealed, whatever the seal is warning of."],["old-guilt","Old Guilt","Carries a death that was theirs to prevent, and never set it down."],["the-bottle","The Bottle","Trusts a drink to quiet what the quiet hours stir up, and pays in clarity on the morning it is needed most."],["softhearted","Softhearted","Will go back for a body when going back is the mistake that makes two."],["the-grudge","The Grudge","Keeps a name they mean to answer for, whatever it costs the others."],["proud-of-wound","Proud of the Wound","Wears every scar as a story, and courts the next one to tell."],["trusts-too-easy","Trusts Too Easy","Takes a stranger at their word, and has paid for it more than once."],["cold-streak","The Cold Streak","Goes somewhere far away when the fear comes, and not always back in time."],["never-asks","Never Asks","Would rather bleed in silence than admit the wound to anyone, and has hidden a bad one until it chose the fight for them."],["the-debt","The Debt","Owes coin in the wrong quarters, and it has a way of following them into the dark."],["reads-omens","Reads the Omens","Sees doom in a spilled cup, and has left a winnable fight over a bad sign."],["cant-let-lie","Can't Let It Lie","Has to win the argument, even the one that costs more than losing would."],["soft-spot","The Soft Spot","Cannot say no to a child, a stray, or a hard-luck story, true or not."],["overreaches","Overreaches","Always takes the harder path to prove the easier one was beneath them, and is proudest at the moment it goes wrong."],["slow-to-trust","Slow to Trust","Keeps everyone at arm's length, and has missed the hand that would have held."],["heros-habit","The Hero's Habit","Cannot watch and do nothing, even when doing nothing is the plan."],["keeps-score","Keeps Score","Remembers every favour owed and owing, and never quite lets any of it go."],["too-honest","Too Honest","Says the true thing at the worst possible moment, and means it kindly."],["wanderers-itch","The Wanderer's Itch","Grows restless in any place safe enough to stay in, and tends to move on the season before the one that would have been theirs."],["gambles","Gambles","Cannot pass a wager, a long shot, or a door marked do not open, and remembers the wins far better than the ledger would allow."],["loyal-to-fault","Loyal to a Fault","Follows the ones they love past the point the love makes sense."],["short-fuse","The Short Fuse","Burns hot and fast, and has said what cannot be unsaid more than once."],["never-satisfied","Never Satisfied","Whatever they win, it is never the thing they wanted, and they go again."],["haunted","Haunted","Sleeps badly, and the thing that keeps them up sometimes walks the daylight too."],["the-martyr","The Martyr","Takes the blame that is not theirs, and the wound that need not have been."],["cant-be-led","Can't Be Led","Chafes under any hand but their own, and has broken a good plan just to have made it their own."],["sentimental","Sentimental","Keeps what should be let go, a blade, a grudge, a face, long past all use."],["golden-cage","The Golden Cage","Cannot walk away from a comfort once they have it, even a poisoned one."],["bravado","Bravado","Bites off more than the odds allow, and grins while chewing."],["long-memory","The Long Memory","Forgives nothing, forgets less, and would call it loyalty."],["loose-tongue","A Loose Tongue","Cannot hold a secret past the second cup, and has given away more than one that mattered."],["cant-take-yes","Can't Take Yes for an Answer","Argues past the point of winning, and has talked a friend out of agreeing with them."],["gives-too-much","Gives Too Much Away","Cannot watch someone go without and keep their own, and has ended a hard season poorer than the people they helped."],["always-right","Always Has to Be Right","Would rather be proven right than come out ahead, and has managed both at once and enjoyed only the first."],["spends-it-first","Spends It Before It's Earned","Lives on the reward before it is in hand, and has been caught short when the hand came up empty."],["picks-old-wounds","Picks at Old Wounds","Cannot leave a healed hurt alone, their own or another's, and reopens what time had closed."],["cant-sit-still","Can't Sit Still","Grows dangerous with idleness, and goes looking for a fight when none is offered."],["flattered-easily","Flattered Easily","Warms to anyone who praises them, and has trusted a smooth word over a plain friend."],["cant-say-no","Can't Say No","Takes on more than any one person can carry, and drops something quietly rather than admit it."],["hoards-glory","Hoards the Glory","Cannot share a win, and has soured a triumph counting who got the credit."],["freezes-at-fork","Freezes at the Fork","Cannot choose when it matters most, and has let the moment choose for them."],["spooks-easy","Spooks Easy","Startles at a shadow and swings at it, and has hurt the wrong thing in the dark more than once."],["counts-coppers","Counts Every Copper","Cannot spend freely even when it is the wise thing, and has lost a pound guarding a penny."],["dwells","Dwells","Chews the same worry long after it can be helped, and has walked into a fight already half-lost in their own head."],["contrary","Contrary","Wants a thing the moment they are told they cannot have it, and loses all interest the moment they can."],["never-apologises","Never Apologises","Would sooner let a rift stand for years than say the one word that would close it."],["waits-to-be-told","Waits to Be Told","Will not act without leave, and has watched a moment pass rather than take it uninvited."],["quick-to-despair","Quick to Despair","Reads a setback as the end, and has given up on a fight that was still there to be won."],["vain","Vain","Minds their reflection more than their footing, and has been caught looking the wrong way."],["green-eye","The Green Eye","Cannot watch another get what they wanted without it curdling, and it shows before they can hide it."],["no-patience","No Patience","Cannot wait for a slow plan to ripen, and has sprung a trap early just to be done with the waiting."],["everyones-friend","Everyone's Friend","Cannot bear to be disliked, and has agreed to two opposite things in one evening to keep the peace."]],"flawTraits":{"pride":["arrogant"],"greed":["greedy"],"unlocked-door":["curious","reckless"],"old-guilt":["haunted"],"softhearted":["loyal"],"the-grudge":["hot-headed","lone-wolf"],"proud-of-wound":["glory-hunter","reckless"],"cold-streak":["shaken"]},"vows":[["place-home","place","Unfinished Business","","",0,["sellsword","expedition"],"Means to go home to {region} one day, and settle what was left unsettled there.","The guild's work took them home to {region} at last, and what was left unsettled there is settled."],["place-debt","place","An Unpaid Debt","","",0,["sellsword","relic"],"Bears an old debt to a family in {region} that no coin, favour, or season will ever settle.","They went back into {region} on the guild's business and stood for its people, and the old debt weighs a little lighter."],["place-grave","place","A Grave to Answer","","",0,["bounty","sellsword"],"Left someone in the ground in {region}, and will not have it be for nothing.","They answered {region}'s call and came home from it, and the one they left in its ground did not go unanswered after all."],["place-fire","place","Against the Fire","","",0,["sellsword"],"Vowed to stand for {region} the next time the fire comes.","The call came out of {region}, and this time they were there to stand in the fire's way."],["place-name","place","A Name to Find","","",0,["bounty","expedition"],"Keeps a name out of {region} they mean to find, alive or otherwise.","Guild work walked them through {region} again, and they came out of it nearer the name they went looking for."],["place-fled","place","The Second Time","","",0,["bounty","sellsword"],"Fled {region} once, and swore that the next time they would not run.","They went back into {region} when it called, and this time they did not run."],["place-turned","place","Turned Away","","",0,["sellsword","expedition"],"Was turned out of {region} young, and means to return as someone they cannot turn away.","They returned to {region} in the guild's name, as someone it could not turn away this time."],["place-patch","place","The Only Ground","","",0,["sellsword","relic"],"Holds a patch of {region} as the only ground that is theirs, and means to earn it back.","They stood on their patch of {region} again on the guild's work, this time with the whole hall at their back."],["place-answer","place","Something They Did","","",0,["bounty","sellsword"],"Means to go back to {region} and answer for something they did there.","The guild's business took them back into {region}, and they answered for it by standing where once they could not."],["mark-promise","place","A Promise Unspoken","","",0,["relic","expedition"],"Made a promise at {landmark} they have told no one, and have not broken yet.","The road took them past {landmark} again in the guild's service, and the promise they made there is a promise kept."],["mark-debt","place","A Debt of the Spirit","","",0,["relic","expedition"],"Owes {landmark} a debt of the spirit, and means to pay it before the end.","They stood before {landmark} once more on the guild's work, and paid the debt of the spirit they owed it."],["mark-stand","place","One Last Time","","",0,["relic","expedition"],"Means to stand before {landmark} once more before the end.","The guild's business brought them before {landmark} one more time, as they always swore it would."],["kin-coin","kin","Coin Sent Home","","",0,0,"Sends every coin they can spare back to a family that does not know their face any more.","The family they sent every coin to has come to them instead, blood under one roof at last."],["kin-graveside","kin","The Last of the Blood","","",0,0,"Swore at a graveside to be the last of their blood the dark takes early.","They swore to be the last of their blood taken early, and now there are two of them to hold that line."],["kin-sibling","kin","The Childhood Owed","","",0,0,"Raised a younger sibling on nothing, and means to give them the childhood they never had.","The sibling they raised on nothing walks in grown and armed, and stands beside them at last."],["kin-work","kin","A Parent's Work","","",0,0,"Carries a parent's unfinished work, and will not be the one to set it down.","Kin who share their family's unfinished work have come to carry it beside them."],["kin-brother","kin","A Sibling's Debt","","",0,0,"Means to buy a sibling out of a debt that was never theirs to owe.","The sibling they meant to buy free walks into the guild free, kin under one banner."],["kin-shadow","kin","The Family Name","","",0,0,"Left home under a shadow, and means to clear the family name before a parent passes.","Kin who carry the family name they left to clear walk in beside them, and the old shadow lifts a little."],["kin-locket","kin","The Unopened Locket","","",0,0,"Keeps a locket they have never once opened in front of anyone.","The face in the locket they never opened is here in the flesh now, and the locket can stay shut."],["self-blade","self","Not in a Bed","","fieldDeath",0,0,"Swore they would die with a blade in hand, not in a bed.","They fell with a blade in their hand and not in a bed, which is the death they swore to."],["self-worth","self","Worth the Name","","",0,0,"Means to be worth more than the name they were handed.","Delve on delve, they made themselves worth more than the name they were handed, and everyone who said otherwise knows it now."],["self-deedname","self","A Name in the Dark","brave","deedTitle",0,0,"Swore the dark would learn their name before it learned their face.","The hall has a name for them now, earned in the dark, and the dark has learned it too."],["self-deedcount","self","Every One Counted","iron-willed","deedTitle",0,0,"Keeps a count of every foe they have felled, and swore the count would one day earn them a name.","The count earned them a name at last. They still keep it, out of habit now."],["self-kneel","self","Never Again to Kneel","","",0,0,"Vowed never to kneel again, to anyone, for any reason.","Season after season they stood, and never once knelt to anyone. The vow is kept."],["self-tally","self","The Tally","","",0,0,"Keeps a tally of every life they failed to save, and means to end it in the black.","The tally they kept of the ones they could not save stands in the black now, more carried home than left behind."],["self-habit","self","The Quiet War","","",0,0,"Swore off a habit that once cost them everything, and fights it every quiet day.","Every quiet day they fought the old habit, and every quiet day they won. It has been years now."],["self-onetrue","self","One True Thing","","",0,0,"Means to leave one true thing behind them, whatever it takes.","They set out to leave one true thing behind them, and a career of it says they have."],["self-ran","self","Never the One Who Ran","","",0,0,"Promised themselves they would never again be the one who ran.","Fight on fight, they were never the one who ran, and now there is no one who could say they were."],["ppl-wrong","people","A Wrong Remembered","","",0,0,"Answers for a wrong done to their kindred that the realm would rather forget.","They marched to war where their kindred live, and answered a wrong the realm would rather have forgotten."],["ppl-houses","people","Among the Great Houses","","",0,0,"Means to see their kin counted among the great houses again, not pitied.","They stood in the field for their kindred's own country, and a name once pitied is spoken with respect again."],["ppl-grief","people","The Shared Grief","","",0,0,"Carries a grief their kindred all carry, and refuses to let it be the last word.","They answered the muster in their kindred's homeland, and made the shared grief into something other than the last word."],["ppl-rite","people","The Kept Rite","","",0,0,"Swore to keep a rite their kin are forgetting, so that someone still remembers how.","They stood for their kindred's own ground when it called, and the rite they swore to keep is kept a while longer."],["ppl-rise","people","The Proof","","",0,0,"Means to be the proof that a kindred written off can rise.","They marched for their kindred's country and held their place in the line, the proof, in the flesh, that a kindred written off can rise."],["ppl-tookin","people","Those Who Took Them In","","",0,0,"Owes a debt to the ones who took them in when their own could not.","They answered the call to their kindred's homeland, and paid a little of the debt to the ones who took them in."],["quarry-head","quarry","A Head for the Wall","brave","",0,0,"Means to bring down a beast worth a name out of {region}, and hang its head where the whole guild can see.","They brought down a beast {region} had a name for, and its head hangs where the whole guild can see it now."],["quarry-again","quarry","The One That Got Away","brave","",0,0,"Was bested once by a thing out of {region}, and swore the next great beast would not walk away.","The next great beast did not walk away. Whatever the last one took from them, this one paid back."],["quarry-terror","quarry","No More Terrors","brave","",0,0,"Lost someone to a thing out of {region}, and means to be the end of such things.","They stood over a slain terror at last, and the one they lost to such a thing has been answered for."],["bond-comehome","bond","Someone to Come Home To","","",0,0,"Keeps their heart guarded, but half-means to find one person worth coming back for.","They found one person worth coming back for, and stopped guarding their heart quite so closely."],["bond-truefriend","bond","One True Friend","","",0,0,"Has never let anyone all the way in, and half-wishes they could.","Somewhere in the dark, without quite meaning to, they let someone all the way in. It held."],["bond-notstranger","bond","Not a Stranger at the End","","",0,0,"Fears dying a stranger more than dying, and means to matter to someone first.","They came to matter to someone, deeply and plainly, and the old fear lost its teeth."],["legacy-service","legacy","The Long Service","","retire",0,0,"Means to be one of the few who walks away on their own feet, not carried.","They walked away on their own feet, an old hand full of years, and hung up the blade for good."],["legacy-seat","legacy","A Seat by the Fire","","joinStaff",0,0,"Means to still be of use to the guild when the delving is behind them.","The delving behind them, they took a seat on the council, and the guild kept their wisdom."],["legacy-hall","legacy","A Hall of Their Own","","takesHall",0,0,"Means to run a guild before the end, and to be the one whose name is over the door.","They left to take a hall of their own, and the name over that door is theirs now."],["legacy-line","legacy","A Line to Carry the Name","","descendant",0,0,"Means to leave a name the guild will still be saying long after they are gone.","Their blood walks the guild again, and the name they meant to leave is still being said in it."],["war-songs","war","Blooded at the Front","brave","",0,0,"Means to be the one the songs are about when the coalition marches home.","When the coalition marched home, the songs were about them."],["war-answered","war","When the Horn Goes","stalwart","hornAnswered",0,0,"Swore they would never again be in a guild that heard the horn and stayed by its fire.","The horn went up, and this guild answered it. They were not by the fire when it did."],["war-called","war","Answering for the Realm","brave","hornAnswered",0,0,"Holds that a guild which will not march for the realm has no business asking anything of it.","The realm called and the guild marched, and they have stopped saying it out loud so often."],["war-standard","war","The Standard-Bearer","stalwart","",0,0,"Swore the realm would one day owe them a war it could not have won without them.","The realm won a war it could not have won without them, and everyone who marched in it says so."],["trophy-crown","trophy","The Crown, Once","iron-willed","championship",0,0,"Means to stand in a guild crowned champion of the realm, just once.","The guild was crowned champion of the realm, and they were standing in it. Once was enough to last a life."],["trophy-showcase","trophy","First Prize","professional","gathering",0,0,"Means to win a Gathering outright, and hear the whole realm say their name.","They won the Gathering outright, and for one bright evening the whole realm said their name."],["rival-castout","rival","The Guild That Cast Me Out","iron-willed","",0,0,"Was cast out by {rival} once, and means to still be standing the day that guild is not.","{rival}, the guild that cast them out, has come apart at last. They were still standing to see it, as they swore they would be."],["rival-reckoning","rival","A Reckoning","iron-willed","",0,0,"Keeps a cold, private reckoning with {rival}, and means to outlast them.","Whatever lay between them and {rival}, it is settled now: {rival} has fallen, and they have not."],["deep-down","deep","Down","iron-willed","",0,0,"Means to go down the old stair, and to be standing on a floor of it that no one in this guild has stood on.","They stood on a floor of the Deep that no one in this guild had stood on before. The stair gave up one more of its steps, and they were on it."],["deep-name","deep","A Name in the Dark","brave","",0,0,"Heard a name spoken of the Deep as a child, and has never once been able to leave it alone.","They went down after the name they had carried since they were a child, and the dark gave up a little more of it."],["deep-owed","deep","What the Stair Took","stalwart","",0,0,"Lost someone to the old stair, and does not intend for the Deep to keep both of them.","They took a floor of the stair that took someone from them. The Deep does not give anyone back, but it has been made to give something up."],["deep-first","deep","The First Down","iron-willed","",0,0,"Means to be in the party that opens a floor of the Deep. Hearing about it afterwards would be unbearable.","They were in the party that opened the floor, not the one that heard about it afterwards. That will be said of them for a long while."],["deep-bottom","deep","How Far It Goes","iron-willed","",0,0,"Does not care what is at the bottom of the Deep so much as whether anyone alive can say how far down it is.","Another floor answered to them, and the question they actually came for, how far down it goes, has one more step of an answer."],["deed-drawn","deed","First to Be Struck","","",["drawn","tank",""],0,"Swore that every blow meant for the party would find them first, and keeps the count.","They have stood in front of more blows than anyone can remember, and they have the count to prove it."],["deed-dealt","deed","A Tally for the Dark","","",["dealt","dps",""],0,"Keeps a tally of the harm they have done the dark, and swore it would one day be a number worth saying aloud.","The tally is a number worth saying aloud now. They say it rarely."],["deed-mended","deed","Nothing Lost to Want of Mending","","",["mended","healer",""],0,"Swore to put back more than the dark could take, and keeps the count to prove it.","They have mended more than the dark has taken from this hall. The count says so, and they do not."],["deed-swarm-granary","deed","The Granary Year","","",["kills","dps","swarm"],0,"The vermin came up through the floor of the family granary in {region} the year they were nine, and the family went hungry that winter. Means to make the dark pay for it, one at a time.","The granary year is paid for. They stopped counting once it was, and slept better for it."],["deed-swarm-cellar","deed","The Cellar Stair","","",["kills","dps","swarm"],0,"Was sent down a cellar stair as a child to see what the scratching was, and has not forgiven the dark for what was waiting. Means to answer it, one at a time.","The scratching in the cellar has been answered many times over. They go down cellar stairs without a lamp now."],["deed-swarm-stores","deed","What Got Into the Stores","","",["kills","dps","swarm"],0,"Watched a village in {region} sicken from what the vermin left in its stores. Means to clear the dark of as many of them as one life can manage.","They have cleared the dark of more vermin than that village ever saw. It does not bring anyone back, and they know it."],["deed-armored-iron","deed","Nothing It Can Hide Behind","","",["kills","dps","armored"],0,"Watched a friend die behind a shield that did not hold, against a thing in iron that did. Means to prove iron breaks.","Iron breaks. They have proved it often enough that it no longer needs saying."],["deed-armored-smith","deed","The Smith's Lesson","","",["kills","dps","armored"],0,"Learned at a forge that no iron was ever made that cannot be broken, and means to prove it on whatever the dark sends wearing it.","No iron the dark has sent them has held. The smith who taught them would be pleased, and would say so briefly."],["deed-armored-plate","deed","Under the Plate","","",["kills","dps","armored"],0,"Saw a thing in plate walk through a line of their kin in {region} as if they were not there. Means to find out what is underneath, as many times as it takes.","They have seen underneath the plate often enough. There is nothing there worth fearing, and they tell the young ones so."],["deed-beast-teeth","deed","Teeth in the Dark","","",["kills","dps","beast"],0,"Carries a bite scar from a thing that came out of the dark on four legs, and means to take a toll of its kind for it.","The toll is taken. The scar still aches in the cold, and they let it."],["deed-beast-drover","deed","The Drover's Count","","",["kills","dps","beast"],0,"Grew up minding herds in {region}, and counted the losses every morning after the things came down from the dark. Means to count theirs instead.","The count runs the other way now. Somewhere in {region}, a herd sleeps easier for it."],["deed-beast-hound","deed","What Took the Hound","","",["kills","dps","beast"],0,"Lost the dog that walked beside them every day of their childhood to something that hunted on four legs. Means to hunt its kind back.","Its kind has been hunted back, and hard. They have a dog again, and it is not allowed on delves."],["deed-grunt-militia","deed","The Line That Broke","","",["kills","dps","grunt"],0,"Stood in a militia line in {region} that broke when the dark came at it in ranks. Means to break as many of those ranks as it takes to forget the sound.","They have broken more ranks than that militia ever faced. The sound is quieter now."],["deed-grunt-hundreds","deed","By the Hundred","","",["kills","dps","grunt"],0,"Was told as a recruit that the dark sends its soldiers by the hundred, and decided to take that as a number to beat.","The hundreds have been met, and beaten. They still keep the count, out of a soldier's habit."],["deed-grunt-front","deed","For the Front Rank","","",["kills","dps","grunt"],0,"Was at the back of a line that lost everyone in front of them. Means to stand where those people stood, and take the dark's soldiers off the field one by one.","They stand where the front rank stood now, and the dark has sent a great many soldiers to find it holding."],["deed-archer-unseen","deed","From Out of Sight","","",["kills","dps","archer"],0,"Carries the head of an arrow they never saw coming, and means to answer every one of the dark's skirmishers that thinks itself unseen.","The dark's skirmishers have learned they are seen. They keep the arrowhead on a cord, out of habit."],["deed-archer-road","deed","The Road Watch","","",["kills","dps","archer"],0,"Lost a cousin on a road in {region} to things that struck from cover and were gone before anyone turned. Means to make sure they stop getting away.","Plenty of them have stopped getting away. The roads of {region} are a little quieter for it."],["deed-archer-reach","deed","Close the Distance","","",["kills","dps","archer"],0,"Was taught that a thing that shoots from afar is brave only until someone reaches it. Means to be that someone, as often as it takes.","They have reached a great many of them. The lesson held every time."]],"kindTrigger":{"place":"placeWork","kin":"sibling","self":"delveMilestone","people":"kindredWar","quarry":"bossSlain","bond":"closeBond","war":"warHero","rival":"rivalFall","deep":"deepFloor","deed":"deedVow"},"triggers":{"sibling":"A true sibling of theirs comes to the guild.","placeWork":"Send them on the right kind of work in {place}.","delveMilestone":"They survive their 25th delve.","fieldDeath":"They fall in the field with a blade in hand.","kindredWar":"March them to a war in their kindred's homeland.","bossSlain":"They help bring down a named beast on a delve.","closeBond":"They form a close bond with someone in the guild.","retire":"They walk away on their own feet, rather than being carried.","takesHall":"They leave to lead a guild of their own.","joinStaff":"They take a seat on the council when the delving is behind them.","descendant":"A descendant of theirs comes to the guild.","warHero":"They are named the hero of a war.","championship":"The guild is crowned champion of the realm.","gathering":"They win a Gathering outright.","rivalFall":"{rival} falls into crisis.","deepFloor":"They are in the party that takes a floor of the Deep.","hornAnswered":"The guild answers a muster while they are on the roster.","deedTitle":"They earn a deed title: enough killing blows on one kind of foe.","deedVow":"They do the work they swore to, enough times over, counted from the day they swore it."},"regions":[["vale","The Ninefold Vale","The Crucible Ground"],["ironhold","The Ironhold Deeps","The First Deep"],["elderwood","The Elderwood","The Mootstone"],["ashen-marches","The Ashen Marches","The Ashgate"],["riven-peaks","The Riven Peaks","The Skyshrine"],["pale-reach","The Pale Reach","The Drowned Barrow"],["cindermoor","The Cindermoor","The Great Bones"]],"manifestBlurb":{"cursed":"It came out of the forge wrong, and it works against the hand that holds it.","flawed":"A great work with a fault running through it. Still finer than most things you will ever hold.","worn":"Whatever it once was, the years have had some of it back.","potent":"Everything a piece like this is supposed to be.","vaunted":"Spoken of well beyond the guild that owns it.","exalted":"Among the finest examples anyone has seen of its kind.","sovereign":"It has become everything it could ever be. There is no better version of it."},"callingId":{"guardian":"shield-bash","paladin":"lay-on-hands","warden":"cleave","blademaster":"whirlwind-edge","arcanist":"arcane-lance","ranger":"volley","cleric":"smite","druid":"thornburst","bard":"mocking-verse"},"conditions":{"flooded":["Flooded","Waist-deep black water drags at every step; blades and footwork bog down where a steady aim does not.","Archers and casters keep their bite; melee fighters are slowed.","The water hides how it works: the roll needs 1 more to pass."],"darkness":["Pitch Dark","A smothering, unnatural dark. Bows and spells lose their aim in the black; only those fighting at arm's length see true.","Bring blades: archers and casters lose accuracy in the dark.","The dark hides how it works: the roll needs 1 more to pass."],"cursed":["Cursed Ground","Old wards leach at the will of the living: mana and focus drain away faster than they can be drawn.","Drains mana and focus: rage and stamina fighters fare best.","The old wards resist the mind: the roll needs 1 more to pass."],"deepcold":["Deep Cold","A killing cold seeps into the bones. A wound that would mend turns mortal, and nerves fray with every room you press deeper.","A delver who falls here is far likelier to die: keep a Physician on your staff. Every room deeper frays nerves, and the cold makes traps and puzzles harder to pass.","The cold has seized the workings: the roll needs 1 more to pass."],"infernal":["Infernal","The ground still burns from every war fought over it. The heat comes up through boots and armour alike, and nobody stands in it for long without paying.","Everyone burns a little every moment of a fight, and armour does not stop it. End fights fast and bring healing that keeps up."],"frozen":["Numbing Frost","The high cold takes the body first. Arms that swing and legs that brace give out long before the mind does.","Stamina and rage drain away; mana and focus are untouched. Casters and focus fighters fare best, and a Paladin holds the line here.","Numb hands and feet: the roll needs 1 more to pass."]},"conflicts":[["brave","cowardly"],["humble","arrogant"],["professional","reckless"],["team-player","lone-wolf"],["iron-willed","superstitious"],["methodical","hot-headed"],["stalwart","cowardly"],["diligent","reckless"],["hopeful","superstitious"],["quick-witted","hot-headed"],["dauntless","cowardly"],["dauntless","brittle"],["stoic","brittle"],["stoic","hot-headed"],["brave","brittle"],["exacting","humble"],["old-school","broad-hand"],["oathbound","greedy"],["oathbound","glory-hunter"],["oathbound","loyal"],["iron-willed","brittle"],["unbreakable","brittle"],["stalwart","brittle"],["cool-headed","hot-headed"],["cool-headed","reckless"],["vigilant","reckless"],["watchful","reckless"],["sure-footed","reckless"],["sure-footed","clumsy"],["methodical","clumsy"],["professional","clumsy"],["steady","reckless"],["steady","insubordinate"],["professional","insubordinate"],["diligent","insubordinate"],["methodical","insubordinate"],["traditional","insubordinate"],["humble","vain"],["generous","vain"],["generous","greedy"],["team-player","vain"],["inspiring","vain"],["hopeful","haunted"],["restless","methodical"],["restless","traditional"],["tireless","restless"],["quick-to-mend","slow-to-mend"],["weathered","fair-weather"],["dutiful","insubordinate"],["thrifty","greedy"],["unforgiving","easygoing"],["easygoing","hot-headed"],["light-fingered","generous"],["light-fingered","oathbound"],["sore-loser","stoic"],["sore-loser","humble"],["giant-killer","cowardly"],["old-soldier","cowardly"],["claustrophobic","dauntless"],["gambler","methodical"],["blood-drunk","cowardly"],["blood-drunk","cool-headed"],["early-riser","light-sleeper"],["thick-skinned","sore-loser"],["thick-skinned","vain"],["hardy","frail"],["companionable","lone-wolf"],["crowd-pleaser","humble"],["peacemaker","unforgiving"],["peacemaker","hot-headed"],["trap-wise","clumsy"],["hard-bargainer","generous"],["consistent","gambler"],["deep-seasoned","claustrophobic"],["death-defying","brittle"],["indomitable","frail"],["jinxed","lucky"],["glass-jawed","hardy"],["streaky","consistent"],["homebody","restless"],["homebody","road-hardened"],["coin-minded","oathbound"],["coin-minded","thrifty"],["death-seeker","cowardly"]],"delveMilestone":25};

const MARK = String.fromCharCode(1) + 'DDZ1:';
const OFF = 32;
function sign(str) {
  let a = 2166136261, b = 16777619;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    a = Math.imul(a ^ c, 16777619) >>> 0;
    b = Math.imul(b + c, 2246822507) >>> 0;
  }

}
function pack(bytes) {

  let acc = 0, bits = 0;
  for (let i = 0; i < n; i++) {

    if (bits >= 15) { bits -= 15; out.push(((acc >>> bits) & 32767) + OFF); acc &= (1 << bits) - 1; }
  }
  if (bits > 0) out.push(((acc << (15 - bits)) & 32767) + OFF);
  let s = '';
  for (let i = 0; i < out.length; i += 8192) s += String.fromCharCode(...out.slice(i, i + 8192));
  return s;
}
function unpack(s) {
  const n = (s.charCodeAt(0) - OFF) | ((s.charCodeAt(1) - OFF) << 15);

  let acc = 0, bits = 0, k = 0;
  for (let i = 2; i < s.length && k < n; i++) {
    acc = (acc << 15) | (s.charCodeAt(i) - OFF); bits += 15;
    while (bits >= 8 && k < n) { bits -= 8; bytes[k++] = (acc >>> bits) & 255; }
    acc &= (1 << bits) - 1;
  }
  return bytes;
}
async function inflateBytes(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return await new Response(stream).text();
}
async function deflateText(text) {
  const stream = new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decodeSaveText(text) {
  const top = JSON.parse(text);
  let kind, payload;
  if (top && top.v === 1 && typeof top.data === 'string') {
    kind = 'sav';
    payload = top.data.startsWith(MARK) ? await inflateBytes(unpack(top.data.slice(MARK.length))) : top.data;
  } else if (top && top.guild) {
    kind = 'backup'; payload = text;
  } else throw new Error('not-a-save');
  const save = JSON.parse(payload);
  if (!save || !save.guild || typeof save.version !== 'number') throw new Error('no-guild');

function starsOf(ability) { return Math.min(5, Math.max(0.5, Math.round((ability / 200) * 5 * 2) / 2)); }
function allHeroes(guild) {
  return [...(guild.roster || []), ...(guild.recruits || []).map(r => r && r.adventurer).filter(Boolean)];
}
/* Brings derived fields in line and reports values the game never produces. Mutates the guild. */
function tidyGuild(guild) {
  const warns = [];
  for (const h of allHeroes(guild)) {
    const tag = h.name || h.id;
    if (typeof h.currentAbility === 'number') h.abilityStars = starsOf(h.currentAbility);
    if (typeof h.potentialAbility === 'number') h.potentialStars = starsOf(h.potentialAbility);
    if (h.potentialAbility > 200) warns.push(['paMax', tag, h.potentialAbility]);
    if (h.currentAbility > h.potentialAbility) warns.push(['caPa', tag, h.currentAbility, h.potentialAbility]);
    if (h.level < 1 || h.level > 20) warns.push(['level', tag, h.level]);
    for (const grp of ['attributes', 'hidden']) for (const [k, v] of Object.entries(h[grp] || {})) {
      if (typeof v !== 'number' || v < 1 || v > 20) warns.push(['range', tag, k, v]);
    }
  }
  if (guild.tampered) delete guild.tampered;
  return warns;
}

  tidyGuild(save.guild);

  const sig = sign(g);
  save.sig = sig;
  const text = '{"version":' + save.version + ',"guild":' + g + ',"sig":' + JSON.stringify(sig) + '}';
  if (as === 'backup') return text;
  return JSON.stringify({ v: 1, writtenAt: Date.now(), data: MARK + pack(await deflateText(text)) });

}

  const title = document.getElementById('modal-title'); if (title) title.textContent = `${t('itemTitle')}: ${it.name}`;
  const ql = document.getElementById('it-qlabel'); if (ql) ql.textContent = qualityLabel(it);
}
function focusBack(id) { if (!id) return; const el = document.getElementById(id); if (el) el.focus(); }
function closeModal() { S.modal = null; renderModal(); }
function saveItemModal() {
  const m = S.modal; const it = m.item; const gd = g();
  if (m.target.kind === 'stash') gd.stash[m.target.idx] = it;
  else if (m.target.kind === 'new-stash') { gd.stash = gd.stash || []; gd.stash.push(it); }
  else { const h = heroByKey(m.target.hero); h.equipment = h.equipment || {}; h.equipment[m.target.slot] = it; }
  S.modal = null; render();
}
function onClick(e) {
  const vb = e.target.closest('[data-view]'); if (vb) { S.view = vb.dataset.view; S.confirmDel = null; render(); window.scrollTo(0, 0); return; }
  const hb = e.target.closest('[data-hero]'); if (hb) { S.heroKey = hb.dataset.hero; render(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb) { S.compTab = tb.dataset.tab; render(); return; }
  const lb = e.target.closest('[data-lang]'); if (lb) { S.lang = lb.dataset.lang; try { localStorage.setItem('ddle-lang', S.lang); } catch (er) { /* ignore */ } render(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act; const h = curHero(); const gd = S.save ? g() : null;
  if (act === 'modal-veil') { if (e.target === a) closeModal(); return; }
  switch (act) {
    case 'open': $('#fileIn').click(); break;
    case 'copy-path': copyText(SAVE_PATH, a.parentElement.querySelector('.save-path')); break;
    case 'heal-all': allHeroes(gd).forEach(x => { x.injury = null; }); toast(t('done')); render(); break;
    case 'rest-all': allHeroes(gd).forEach(x => { x.condition = 100; x.stress = 0; x.fatigue = 0; }); toast(t('done')); render(); break;
    case 'morale-all': allHeroes(gd).forEach(x => { x.morale = 100; }); toast(t('done')); render(); break;
    case 'heal': if (h) { h.injury = null; render(); } break;
    case 'revert': if (h && S.origHeroes[S.heroKey]) { const o = JSON.parse(S.origHeroes[S.heroKey]); Object.keys(h).forEach(k => delete h[k]); Object.assign(h, o); toast(t('reverted')); render(); } break;
    case 'trait-del': if (h) { const id = a.dataset.id; h.traitIds = (h.traitIds || []).filter(x => x !== id); if (h.earnedTraitIds) h.earnedTraitIds = h.earnedTraitIds.filter(x => x !== id); render(); } break;
    case 'trait-picker': if (h) { S.modal = { type: 'traits', hero: S.heroKey, q: '', tone: '', cat: '' }; renderModal(); const q = document.getElementById('tp-q'); if (q) q.focus(); } break;
    case 'tp-add': { const hh = heroByKey(S.modal && S.modal.hero); if (hh) { addTraitTo(hh, a.dataset.id); renderMain(); refreshTraitList(); toast(`${t('added')}: ${traitLabel(a.dataset.id)}`); } break; }
    case 'vow-keep': if (h) { keepVow(h); renderMain(); } break;
    case 'vow-unkeep': if (h && h.stakes && h.stakes.vow) { delete h.stakes.vow.resolved; renderMain(); } break;
    case 'max-attrs': if (h) { maxAttrs(h); renderMain(); toast(t('maxDone')); } break;
    case 'max-hidden': if (h) { maxHidden(h); renderMain(); toast(t('maxDone')); } break;
    case 'max-capa': if (h) { maxCaPa(h); renderMain(); toast(t('maxDone')); } break;
    case 'max-state': if (h) { maxState(h); renderMain(); toast(t('maxDone')); } break;
    case 'max-level': if (h) { h.level = LIM.level[1]; h.experience = xpFor(h.level); renderMain(); toast(t('maxDone')); } break;
    case 'max-all': if (h) { maxAll(h); renderMain(); toast(t('maxDone')); } break;
    case 'max-team': (gd.roster || []).forEach(maxAll); toast(t('maxDone')); render(); break;
    case 'cat-pick': { const m = S.modal; const fi = +a.dataset.fam; const f = FAMILIES[fi]; if (!f) break; m.fg.slot = f[0]; if (f[2]) m.fg.kind = f[2]; m.fg.family = fi; m.fg.nameIdx = +a.dataset.name; if (f[8] && rIdx(m.fg.rarity) < rIdx(f[8])) m.fg.rarity = f[8]; const it = forgeItem(m.fg); if (it) { it.id = m.item.id || it.id; m.item = it; } renderModal(); break; }
    case 'item-edit': if (h) openItemModal({ kind: 'equip', hero: S.heroKey, slot: a.dataset.slot }, h.equipment[a.dataset.slot]); break;
    case 'item-new-slot': if (h) openItemModal({ kind: 'new-equip', hero: S.heroKey, slot: a.dataset.slot }, blankItem(a.dataset.slot, CLASS_KIND[h.classId])); break;
    case 'unequip': if (h && h.equipment && h.equipment[a.dataset.slot]) { gd.stash = gd.stash || []; gd.stash.push(h.equipment[a.dataset.slot]); delete h.equipment[a.dataset.slot]; render(); } break;
    case 'equip-pick': if (h) { S.modal = { type: 'pick', hero: S.heroKey, slot: a.dataset.slot }; renderModal(); } break;
    case 'equip-do': { const m = S.modal; const hh = heroByKey(m.hero); const i = +a.dataset.idx; const it = gd.stash.splice(i, 1)[0]; hh.equipment = hh.equipment || {}; if (hh.equipment[m.slot]) gd.stash.push(hh.equipment[m.slot]); hh.equipment[m.slot] = it; S.modal = null; render(); break; }
    case 'stash-new': openItemModal({ kind: 'new-stash' }, blankItem('weapon', 'melee')); break;
    case 'stash-edit': openItemModal({ kind: 'stash', idx: +a.dataset.idx }, gd.stash[+a.dataset.idx]); break;
    case 'stash-dup': { const c = JSON.parse(JSON.stringify(gd.stash[+a.dataset.idx])); c.id = newId(); gd.stash.splice(+a.dataset.idx + 1, 0, c); render(); break; }
    case 'stash-del': { const i = +a.dataset.idx; if (S.confirmDel === i) { gd.stash.splice(i, 1); S.confirmDel = null; } else S.confirmDel = i; render(); break; }
    case 'modal-close': closeModal(); break;
    case 'forge-apply': { const m = S.modal; const it = forgeItem(m.fg); if (it) { it.id = m.item.id || it.id; m.item = it; renderModal(); } break; }
    case 'value-recalc': S.modal.item.value = valueOf(S.modal.item); renderModal(); break;
    case 'reforge': reforge(S.modal.item); renderModal(); break;
    case 'mod-add': { const it = S.modal.item; it.mods = it.mods || {}; const k = MOD_KEYS.find(x => !(x in it.mods)); if (k) it.mods[k] = k === 'accuracy' ? 1 : .05; renderModal(); break; }
    case 'mod-del': delete S.modal.item.mods[a.dataset.key]; renderModal(); break;
    case 'item-save': saveItemModal(); break;
    case 'dl-backup': download('backup'); break;
    case 'dl-sav': download('sav'); break;
  }
}
function onChange(e) {
  const el = e.target;
  if (el.id === 'fileIn') { const f = el.files && el.files[0]; if (f) loadFile(f); el.value = ''; return; }
  if (el.dataset.filter === 'q') return;
  if (el.dataset.filter) { S.traitFilter[el.dataset.filter] = el.value; $('#compBody').innerHTML = compTraits(); focusBack(el.id); return; }
  if (el.dataset.tp && el.dataset.tp !== 'q') { S.modal[el.dataset.tp] = el.value; refreshTraitList(); return; }
  if (el.dataset.x) { commitX(el); return; }
  if (el.dataset.f) commitField(el);
}

function commitX(el) {
  const h = curHero(); if (!h) return;
  const k = el.dataset.x, v = el.value;
  if (k === 'conv' && CONV2[v]) h.stakes.conviction = v;
  else if (k === 'flaw' && FLAW2[v]) h.stakes.flaw = v;
  else if (k === 'vow' && VOW[v]) { const old = h.stakes.vow || {}; h.stakes.vow = buildVow(h, v, old.regionId, old.rivalName); }
  else if (k === 'vowRegion' && h.stakes && h.stakes.vow && REGION[v]) { const old = h.stakes.vow; const nv = buildVow(h, old.templateId, v, old.rivalName); if (nv) { if (old.resolved) nv.resolved = old.resolved; if (old.resworn) nv.resworn = old.resworn; h.stakes.vow = nv; } }
  else if (k === 'vowRival' && h.stakes && h.stakes.vow) { const old = h.stakes.vow; const nv = buildVow(h, old.templateId, old.regionId, v.trim()); if (nv) { if (old.resolved) nv.resolved = old.resolved; if (old.resworn) nv.resworn = old.resworn; h.stakes.vow = nv; } }
  else if (k === 'class') setClass(h, v);
  else if (k === 'grizzled') setGrizzled(h, v);
  else if (k === 'gift') setGift(h, v);
  renderMain();
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.tp === 'q' && S.modal) { S.modal.q = el.value; refreshTraitList(); return; }
  if (el.dataset.catq && S.modal) { S.modal.catQ = el.value; const l = document.getElementById('cat-list'); if (l) l.innerHTML = catalogList(); return; }
  if (el.dataset.filter === 'q') { S.traitFilter.q = el.value; const body = $('#compBody'); const pos = el.selectionStart; body.innerHTML = compTraits(); const n = document.getElementById('tf-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
}

/* ---------------- tooltip, toast, drag-drop ---------------- */
let tipEl = null;
function showTip(target) {
  const k = target.dataset.tip; if (!k) return;
  const [type, id] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
  let title = '', body = '';
  if (type === 'attr') { title = ATTR[id].label; body = descAttr(id); }
  else if (type === 'hid') { title = HID[id].label; body = descHid(id); }
  else if (type === 'trait') { const tr = TRAIT[id]; title = tr ? tr.label : id; body = descTrait(id); if (tr) body = `${T[S.lang].cats[tr.cat]} · ${T[S.lang].rars[tr.rar]} · ${T[S.lang].tones[tr.tone]}. ${body}`; const cf = conflictsOf(id); if (cf.length) body += ` ${t('conflictWith')}: ${cf.map(traitLabel).join(', ')}.`; }
  else if (type === 'fld') { const f = FT[id]; if (f) { const x = f[S.lang] || f.en; title = x[0]; body = x[1]; if (FT_LIM[id]) body += ` ${t('range')}: ${FT_LIM[id]}.`; } }
  else if (type === 'mod') { title = L2(MOD_LABEL[id]); body = `${cap1(unitOf(id))}; ${L2(MOD_NOTE[id])}.`; }
  if (!body) return;
  const tip = $('#tip'); tip.innerHTML = `<b>${esc(title)}</b><br>${esc(body)}`; tip.hidden = false;
  const r = target.getBoundingClientRect(); const tr = tip.getBoundingClientRect();
  let x = r.left; let y = r.bottom + 8;
  if (x + tr.width > window.innerWidth - 12) x = window.innerWidth - 12 - tr.width;
  if (y + tr.height > window.innerHeight - 12) y = r.top - tr.height - 8;
  tip.style.left = Math.max(12, x) + 'px'; tip.style.top = Math.max(12, y) + 'px'; tipEl = target;
}
function hideTip() { $('#tip').hidden = true; tipEl = null; }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch (e) {
    try { const r = document.createRange(); r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (er) { /* nothing to select */ }
    toast(t('copyManual'));
  }
}
let toastTimer = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3200); }

function boot() {
  adopt(makeDemo(), 'demo', '', true);
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('mouseover', e => { const tEl = e.target.closest('[data-tip]'); if (tEl && tEl !== tipEl) showTip(tEl); else if (!tEl && tipEl) hideTip(); });
  document.addEventListener('focusin', e => {
    const row = e.target.closest('.attr-row');
    const tEl = e.target.closest('[data-tip]') || (row && row.querySelector('[data-tip]'));
    if (tEl) showTip(tEl); else if (tipEl) hideTip();
  });
  document.addEventListener('scroll', hideTip, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.modal) closeModal(); hideTip(); } });
  let dragDepth = 0; const veil = $('#dropVeil');
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; veil.textContent = t('drop'); veil.hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) veil.hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; veil.hidden = true; const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadFile(f); });
  render();
}
boot();
